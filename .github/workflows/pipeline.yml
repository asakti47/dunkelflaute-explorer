name: pipeline
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Unpack code bundle if present
        run: if [ -f bundle.tar.gz ]; then tar -xzf bundle.tar.gz && rm bundle.tar.gz; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        if: hashFiles('requirements.txt') != ''
        run: pip install -r requirements.txt pytest
      - name: Fetch NASA POWER data (only if missing)
        if: hashFiles('requirements.txt') != ''
        run: if [ ! -f data/power_daily_grid.parquet ]; then python scripts/fetch_data.py; fi
      - name: Tests
        if: hashFiles('requirements.txt') != ''
        run: python -m pytest -q tests
      - name: Analysis
        if: hashFiles('requirements.txt') != ''
        run: python scripts/run_analysis.py
      - name: Commit outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Pipeline: unpack code, refresh data and results [skip ci]" || echo "nothing to commit"
          git push
